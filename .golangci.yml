version: "2"
run:
  # The Go version is taken from go.mod.
  timeout: 10m
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - depguard
    - dogsled
    - errcheck
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - staticcheck
    - thelper
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/go-logr/logr
            - github.com/coredns/corefile-migration/migration
            - github.com/blang/semver/v4
            - github.com/pkg/errors
            - github.com/davecgh/go-spew/spew
            - k8s.io/api
            - k8s.io/apimachinery/pkg
            - k8s.io/apiserver
            - k8s.io/client-go
            - k8s.io/klog/v2
            - k8s.io/utils/ptr
            - github.com/onsi/ginkgo
            - github.com/onsi/gomega
            - sigs.k8s.io/yaml
            - sigs.k8s.io/controller-runtime
            - sigs.k8s.io/cluster-api
            - github.com/k3s-io/cluster-api-k3s
            - github.com/google/uuid
            - go.etcd.io/etcd
            - google.golang.org/grpc
            - google.golang.org/protobuf
    godot:
      #   declarations - for top level declaration comments (default);
      #   toplevel     - for top level comments;
      #   all          - for all comments.
      scope: toplevel
      exclude:
        - ^ \+.*
        - ^ ANCHOR.*
    gomoddirectives:
      # List of allowed `replace` directives.
      replace-allow-list:
        - sigs.k8s.io/cluster-api
    gosec:
      excludes:
        - G307 # Deferring unsafe method "Close" on type "\*os.File"
        - G108 # Profiling endpoint is automatically exposed on /debug/pprof
        - G115 # integer overflow conversion int -> int32
    importas:
      alias:
        # Kubernetes
        - pkg: k8s.io/api/core/v1
          alias: corev1
        - pkg: k8s.io/apiextensions-apiserver/pkg/apis/apiextensions/v1
          alias: apiextensionsv1
        - pkg: k8s.io/apimachinery/pkg/apis/meta/v1
          alias: metav1
        - pkg: k8s.io/apimachinery/pkg/api/errors
          alias: apierrors
        - pkg: k8s.io/apimachinery/pkg/util/errors
          alias: kerrors
        # Controller Runtime
        - pkg: sigs.k8s.io/controller-runtime
          alias: ctrl
      # Do not allow unaliased imports of aliased packages.
      no-unaliased: true
    nolintlint:
      # Require nolint directives to mention the specific linter being suppressed.
      require-specific: true
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: unused-parameter
          disabled: true
    tagliatelle:
      case:
        rules:
          # Any struct tag type can be used.
          # Support string case: `camel`, `pascal`, `kebab`, `snake`, `goCamel`, `goPascal`, `goKebab`, `goSnake`, `upper`, `lower`, `header`
          json: goCamel
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
        path: test/e2e/*
        text: 'G106:'
      - linters:
          - revive
        path: .*test.*
        text: dot-imports
      - linters:
          - staticcheck
        path: .*test.*
        text: ST1001
      - linters:
          - govet
        text: non-constant format string in call to sigs\.k8s\.io\/cluster-api\/util\/conditions\.
      - linters:
          - staticcheck
        path: .*\.go$
        text: 'SA1019: "sigs.k8s.io\/cluster-api/api/core/v1beta1" is deprecated: This package is deprecated and is going to be removed when support for v1beta1 will be dropped.'
      - linters:
          - staticcheck
        path: .*\.go$
        text: 'SA1019: "sigs.k8s.io/cluster-api/util/deprecated/.*" is deprecated: This package is deprecated and is going to be removed when support for v1beta1 will be dropped.'
      - linters:
          - staticcheck
        path: .*\.go$
        text: 'SA1019: version.ParseMajorMinorPatch is deprecated: This function is deprecated and will be removed in an upcoming release of Cluster API. Please use semver.Parse instead.'
      - linters:
          - staticcheck
        path: .*\.go$
        text: 'SA1019: .*ConditionType is deprecated: This type is deprecated and is going to be removed when support for v1beta1 will be dropped.'
      - linters:
          - staticcheck
        path: .*\.go$
        text: 'SA1019: .*(client\.Apply|GetEventRecorderFor) is deprecated'
      # It's clearer to see that a field gets accessed or func gets called on the embedded objects.
      - linters:
          - staticcheck
        path: (.+)\.go$
        text: 'QF1008: could remove embedded field'
    paths:
      - zz_generated.*\.go$
      - contrib/
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/k3s-io/cluster-api-k3s)
    goimports:
      # put imports beginning with prefix after 3rd-party packages
      local-prefixes:
        - github.com/k3s-io/cluster-api-k3s
  exclusions:
    generated: lax
    paths:
      - zz_generated.*\.go$
      - contrib/
      - third_party$
      - builtin$
      - examples$
