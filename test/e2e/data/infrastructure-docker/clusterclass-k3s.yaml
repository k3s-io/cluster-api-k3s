apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: k3s
spec:
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta3
      kind: KThreesControlPlaneTemplate
      name: k3s-control-plane
    machineInfrastructure:
      templateRef:
        kind: DevMachineTemplate
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        name: k3s-control-plane
    healthCheck:
      checks:
        unhealthyNodeConditions:
          - type: e2e.remediation.condition
            status: "False"
            timeoutSeconds: 20
      remediation:
        triggerIf:
          unhealthyLessThanOrEqualTo: 100%
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: DevClusterTemplate
      name: k3s-cluster
  workers:
    machineDeployments:
      - class: k3s-default-worker
        bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta3
            kind: KThreesConfigTemplate
            name: k3s-default-worker-bootstrap
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: DevMachineTemplate
            name: k3s-default-worker-machinetemplate
        healthCheck:
          checks:
            unhealthyNodeConditions:
              - type: e2e.remediation.condition
                status: "False"
                timeoutSeconds: 20
          remediation:
            triggerIf:
              unhealthyLessThanOrEqualTo: 100%
    machinePools:
    - class: k3s-default-worker
      bootstrap:
        templateRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta3
          kind: KThreesConfigTemplate
          name: k3s-default-worker-bootstrap
      infrastructure:
        templateRef:
          apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
          kind: DevMachinePoolTemplate
          name: k3s-default-worker-machinepooltemplate
  variables:
    - name: kindImageVersion
      required: true
      schema:
        openAPIV3Schema:
          type: string
          default: "v1.28.0"
  patches:
    - name: customImage
      description: "Sets the container image that is used for running devMachines for the controlPlane and default-worker machineDeployments and machinePools."
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: DevMachineTemplate
            matchResources:
              machineDeploymentClass:
                names:
                - k3s-default-worker
          jsonPatches:
            - op: add
              path: "/spec/template/spec/backend/docker/customImage"
              valueFrom:
                template: |
                  kindest/node:{{ .kindImageVersion }}
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: DevMachinePoolTemplate
            matchResources:
              machinePoolClass:
                names:
                - k3s-default-worker
          jsonPatches:
            - op: add
              path: "/spec/template/spec/backend/docker/customImage"
              valueFrom:
                template: |
                  kindest/node:{{ .kindImageVersion }}
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
            kind: DevMachineTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: "/spec/template/spec/backend/docker/customImage"
              valueFrom:
                template: |
                  kindest/node:{{ .kindImageVersion }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevClusterTemplate
metadata:
  name: k3s-cluster
spec:
  template:
    spec:
      backend:
        docker: {}
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta3
kind: KThreesControlPlaneTemplate
metadata:
  name: k3s-control-plane
spec:
  template:
    spec:
      kthreesConfigSpec:
        serverConfig:
          tlsSan:
            - 0.0.0.0
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevMachineTemplate
metadata:
  name: k3s-control-plane
spec:
  template:
    spec:
      backend:
        docker: {}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta3
kind: KThreesConfigTemplate
metadata:
  name: k3s-default-worker-bootstrap
spec:
  template:
    spec: {}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevMachineTemplate
metadata:
  name: k3s-default-worker-machinetemplate
spec:
  template:
    spec:
      backend:
        docker: {}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevMachinePoolTemplate
metadata:
  name: k3s-default-worker-machinepooltemplate
spec:
  template:
    spec:
      backend:
        docker: {}